<!doctype html>
<!-- Social preview source. Regenerate with: bash scripts/regen-screenshots.sh
     Palette is lifted from skills/pmm-launch-kit/scripts/.kit-style.css — if the
     kit is restyled, this follows automatically because the screenshot does. -->
<meta charset="utf-8">
<style>
  :root {
    --side:#0a0b0e; --ink:#f7f8fa; --muted:#c5ccd4; --dim:#9aa3ad;
    --accent:#8cb8ff; --accent-line:rgba(140,184,255,.40);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1280px; height:640px; overflow:hidden; }
  body {
    background:var(--side); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;
    display:grid; grid-template-columns:392px 1fr; align-items:center;
  }

  .rail { padding:0 36px; display:flex; flex-direction:column; gap:20px; }
  .brand { display:flex; align-items:center; gap:11px; }
  .brand svg { width:30px; height:30px; border-radius:7px; display:block; }
  .brand .n { font-size:14.5px; font-weight:700; letter-spacing:-.01em; }
  .brand .n span { color:var(--dim); font-weight:500; letter-spacing:.12em;
                   font-size:10.5px; text-transform:uppercase; margin-left:7px; }

  h1 { font-size:36px; line-height:1.1; font-weight:700; letter-spacing:-.028em; }
  h1 em { font-style:normal; color:var(--accent); }
  .sub { font-size:14.5px; line-height:1.55; color:var(--muted); }

  .facts { display:grid; grid-template-columns:1fr 1fr; gap:10px 14px;
           padding-top:18px; border-top:1px solid rgba(255,255,255,.08); }
  .facts div { font-size:12.5px; color:var(--dim); }
  .facts b { color:var(--muted); font-weight:600; }

  .cmd { font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:14.5px;
         color:var(--accent); border:1px solid var(--accent-line); border-radius:8px;
         padding:10px 13px; background:rgba(140,184,255,.07); align-self:start; }

  /* The whole app, scaled to fit — the point is the shape of a real workspace:
     toolbar, ten-desk sidebar, content, inspector. Body text going small is fine;
     nobody reads a social card, they recognise it. */
  .app { height:640px; display:flex; align-items:flex-start; overflow:hidden; }
  .app img {
    width:1024px; height:640px;     /* 1440x900 at 0.711 — full bleed */
    margin-left:0;
    border-left:1px solid rgba(255,255,255,.10);
  }
</style>

<div class="rail">
  <div class="brand">
    <svg viewBox="0 0 128 128" aria-hidden="true">
      <rect width="128" height="128" rx="28" fill="#15181c"/>
      <path d="M28 85V43h13l23 26 23-26h13v42H87V61L68 83h-8L41 61v24H28z" fill="#f7f8fa"/>
      <circle cx="99" cy="29" r="10" fill="#8cb8ff"/>
    </svg>
    <div class="n">PMM OS<span>Launch Kit</span></div>
  </div>

  <h1>A launch that ships as <em>an app</em>, not a folder of docs.</h1>
  <p class="sub">Positioning, messaging, pricing and ten research desks — every
    claim traced to the evidence that justifies it.</p>

  <div class="facts">
    <div><b>45</b> skills</div><div><b>10</b> research desks</div>
    <div><b>2</b> research engines</div><div><b>0</b> dependencies</div>
  </div>

  <div class="cmd">npx pmm-os install</div>
</div>

<div class="app"><img src="./overview.png" alt=""></div>
